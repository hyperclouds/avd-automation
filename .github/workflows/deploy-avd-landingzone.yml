name: Deploy AVD Landing Zone

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RESOURCE_GROUP: "AVD-LandingZone-RG"
      LOCATION: "westeurope"
      PARAMS_FILE: "./arm-templates/parameters.json"
      LOG_ANALYTICS_WORKSPACE: "AVD-Monitor-Workspace"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Azure using GitHub Secret
        uses: azure/login@v1
        with:
          creds: ${{ secrets.LANDINGZONE }}

      - name: Create Resource Group
        run: |
          echo "Creating Resource Group..."
          az group create --name $RESOURCE_GROUP --location $LOCATION || exit 1

      - name: Deploy Managed Identity
        run: |
          echo "Deploying Managed Identity..."
          az deployment group create \
            --resource-group $RESOURCE_GROUP \
            --template-file ./arm-templates/identity.json \
            --parameters @$PARAMS_FILE || exit 1

      - name: Deploy Networking
        run: |
          echo "Deploying Networking..."
          az deployment group create \
            --resource-group $RESOURCE_GROUP \
            --template-file ./arm-templates/networking.json \
            --parameters @$PARAMS_FILE || exit 1

      - name: Deploy Storage for FSLogix
        run: |
          echo "Deploying Storage..."
          az deployment group create \
            --resource-group $RESOURCE_GROUP \
            --template-file ./arm-templates/storage.json \
            --parameters @$PARAMS_FILE || exit 1

      - name: Deploy Identity & Security
        run: |
          echo "Deploying Identity & Security..."
          az deployment group create \
            --resource-group $RESOURCE_GROUP \
            --template-file ./arm-templates/identity.json \
            --parameters @$PARAMS_FILE || exit 1

      - name: Deploy Security Policies
        run: |
          echo "Deploying Security Policies..."
          LOG_ANALYTICS_ID=$(az resource show \
            --resource-group $RESOURCE_GROUP \
            --name $LOG_ANALYTICS_WORKSPACE \
            --resource-type "Microsoft.OperationalInsights/workspaces" \
            --query id --output tsv)

          az deployment group create \
            --resource-group $RESOURCE_GROUP \
            --template-file ./arm-templates/security.json \
            --parameters @$PARAMS_FILE \
            --parameters logAnalyticsWorkspaceId=$LOG_ANALYTICS_ID || exit 1

      - name: Deploy Monitoring
        run: |
          echo "Deploying Monitoring..."
          az deployment group create \
            --resource-group $RESOURCE_GROUP \
            --template-file ./arm-templates/monitoring.json \
            --parameters @$PARAMS_FILE || exit 1

      - name: Confirm Deployment
        run: |
          echo "✅ AVD Landing Zone deployment complete!"
